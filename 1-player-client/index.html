<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <title>Party Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <header class="topbar">
    <span id="room-label" class="room-label"></span>
    <button id="leave-btn" class="link-btn hidden" type="button">Leave</button>
  </header>

  <main id="app">
    <!-- Join screen is shown until the host accepts us -->
    <section id="join-view" class="view">
      <h1>Party Games</h1>
      <form id="join-form" autocomplete="off">
        <label for="room-input">Room code</label>
        <input id="room-input" class="big-input code-input" maxlength="5"
               autocapitalize="characters" spellcheck="false" required>
        <label for="name-input">Your name</label>
        <input id="name-input" class="big-input" maxlength="16" required>
        <button id="join-btn" class="btn primary" type="submit">Join</button>
        <p id="join-error" class="error" role="alert"></p>
      </form>
    </section>

    <!-- Everything after joining is drawn here by screens.js -->
    <section id="game-view" class="view hidden"></section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
