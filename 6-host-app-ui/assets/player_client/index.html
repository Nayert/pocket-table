<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="color-scheme" content="dark">
  <title>Party Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Connection status: polite live region so screen readers hear changes -->
  <div id="banner" class="banner hidden" role="status" aria-live="polite">
    <span id="banner-text"></span>
    <button id="banner-retry" class="banner-btn hidden" type="button">Retry now</button>
  </div>

  <header class="topbar">
    <span id="room-label" class="room-label"></span>
    <span id="conn-label" class="conn-label hidden" aria-hidden="true"></span>
    <button id="leave-btn" class="link-btn hidden" type="button">Leave</button>
  </header>

  <main id="app">
    <!-- Join screen is shown until the host accepts us -->
    <section id="join-view" class="view" aria-labelledby="join-title">
      <h1 id="join-title">Party Games</h1>
      <div id="resume-box" class="hidden">
        <div class="card body-text" id="resume-text"></div>
        <button id="resume-btn" class="btn primary" type="button">Continue</button>
        <button id="not-me-btn" class="btn" type="button">Not me: join as someone new</button>
      </div>
      <form id="join-form" autocomplete="off" novalidate>
        <label for="room-input">Room code</label>
        <input id="room-input" class="big-input code-input" maxlength="4" inputmode="text"
               autocapitalize="characters" autocorrect="off" spellcheck="false"
               aria-describedby="room-hint" required>
        <p id="room-hint" class="hint">4 letters or numbers, shown on the host's screen.</p>
        <label for="name-input">Your name</label>
        <input id="name-input" class="big-input" maxlength="16" autocorrect="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="go"
               aria-describedby="name-hint" required>
        <p id="name-hint" class="hint">Up to 16 characters.</p>
        <button id="join-btn" class="btn primary" type="submit">Join</button>
        <p id="join-error" class="error" role="alert" aria-live="assertive"></p>
      </form>
    </section>

    <!-- Shown when the room is gone (closed, kicked, expired) -->
    <section id="closed-view" class="view hidden" aria-labelledby="closed-title">
      <h1 id="closed-title">Room closed</h1>
      <div class="card body-text" id="closed-text"></div>
      <button id="closed-btn" class="btn primary" type="button">Join another room</button>
    </section>

    <!-- Everything after joining is drawn here by screens.js -->
    <section id="game-view" class="view hidden"></section>
  </main>

  <!-- Screen titles are announced here when a new screen arrives -->
  <div id="announce" class="sr-only" aria-live="polite"></div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
